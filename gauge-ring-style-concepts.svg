<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#1e3455"/>
      <stop offset="52%" stop-color="#0d1524"/>
      <stop offset="100%" stop-color="#070b12"/>
    </radialGradient>

    <linearGradient id="cyanViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24f0ff"/>
      <stop offset="52%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#ff4fd8"/>
    </linearGradient>

    <linearGradient id="amberMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8c24e"/>
      <stop offset="55%" stop-color="#35e7a8"/>
      <stop offset="100%" stop-color="#35b7ff"/>
    </linearGradient>

    <linearGradient id="redBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5d5d"/>
      <stop offset="50%" stop-color="#f6c744"/>
      <stop offset="100%" stop-color="#46d9ff"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hardGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.2  0 1 0 0 0.55  0 0 1 0 1  0 0 0 1 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #f3f7ff; font-size: 42px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #aebbd1; font-size: 20px; font-weight: 500; }
      .card { fill: rgba(255,255,255,0.055); stroke: rgba(190,214,255,0.17); stroke-width: 1.2; }
      .name { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #eef5ff; font-size: 25px; font-weight: 760; }
      .desc { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #93a3bb; font-size: 16px; font-weight: 520; }
      .value { font-family: "Inter", "Microsoft YaHei", sans-serif; fill: #ffffff; font-size: 34px; font-weight: 820; }
      .unit { font-family: "Inter", "Microsoft YaHei", sans-serif; fill: #93a3bb; font-size: 16px; font-weight: 650; }
      .track { fill: none; stroke: rgba(180,202,235,0.13); stroke-width: 18; stroke-linecap: round; }
      .thinTrack { fill: none; stroke: rgba(180,202,235,0.16); stroke-width: 9; stroke-linecap: round; }
      .ring { fill: none; stroke-linecap: round; filter: url(#softGlow); }
      .tick { stroke-linecap: round; }
      .muted { opacity: 0.28; }
      .floatA { animation: floatA 4.8s ease-in-out infinite; }
      .floatB { animation: floatB 5.4s ease-in-out infinite; }
      .spinSlow { transform-origin: center; animation: spin 10s linear infinite; }
      .dashMove { animation: dashMove 4.6s linear infinite; }
      .pulse { animation: pulse 2.3s ease-in-out infinite; }
      @keyframes floatA { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes floatB { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes dashMove { to { stroke-dashoffset: -120; } }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bgGlow)"/>
  <circle cx="230" cy="120" r="170" fill="#1dd6ff" opacity="0.08"/>
  <circle cx="1390" cy="240" r="240" fill="#ff4fd8" opacity="0.06"/>
  <circle cx="1180" cy="980" r="260" fill="#2de6a8" opacity="0.05"/>

  <text class="title" x="80" y="78">个性环形样式概念</text>
  <text class="subtitle" x="80" y="114">整体仍然是环/半环，但环线本身有形变、断点、节奏和艺术感，可用于弧光仪表、全环仪表、指针仪表。</text>

  <!-- Card 1 -->
  <g transform="translate(70 160)">
    <rect class="card" width="340" height="390" rx="26"/>
    <text class="name" x="30" y="50">碎片轨道</text>
    <text class="desc" x="30" y="80">不规则断片，像被数据切开</text>
    <g transform="translate(170 205)">
      <circle class="track" r="92"/>
      <circle class="ring dashMove" r="92" stroke="url(#cyanViolet)" stroke-width="20" pathLength="100" stroke-dasharray="6 2 13 4 4 3 17 5 8 4" stroke-dashoffset="8"/>
      <circle class="thinTrack" r="65"/>
      <circle class="ring" r="65" stroke="#35e7ff" stroke-width="8" pathLength="100" stroke-dasharray="54 100"/>
      <text class="value" text-anchor="middle" y="6">74</text>
      <text class="unit" text-anchor="middle" y="31">%</text>
    </g>
  </g>

  <!-- Card 2 -->
  <g transform="translate(450 160)">
    <rect class="card" width="340" height="390" rx="26"/>
    <text class="name" x="30" y="50">脉冲齿环</text>
    <text class="desc" x="30" y="80">外圈齿轮刻度，强调监控感</text>
    <g transform="translate(170 205)">
      <circle class="track" r="82"/>
      <circle class="ring" r="82" stroke="url(#amberMint)" stroke-width="18" pathLength="100" stroke-dasharray="68 100"/>
      <circle class="tick spinSlow" r="108" fill="none" stroke="#42e8ff" stroke-width="11" pathLength="100" stroke-dasharray="1.2 4.05" opacity=".62"/>
      <circle class="tick spinSlow" r="59" fill="none" stroke="#f8c24e" stroke-width="7" pathLength="100" stroke-dasharray="1 7.4" opacity=".54"/>
      <text class="value" text-anchor="middle" y="6">68</text>
      <text class="unit" text-anchor="middle" y="31">%</text>
    </g>
  </g>

  <!-- Card 3 -->
  <g transform="translate(830 160)">
    <rect class="card" width="340" height="390" rx="26"/>
    <text class="name" x="30" y="50">液态胶囊</text>
    <text class="desc" x="30" y="80">厚环加流体端点，柔和但有性格</text>
    <g transform="translate(170 205)">
      <circle class="track" r="84" stroke-width="24"/>
      <circle class="ring" r="84" stroke="url(#redBlue)" stroke-width="25" pathLength="100" stroke-dasharray="61 100" transform="rotate(-90)"/>
      <circle class="pulse" cx="81" cy="-25" r="17" fill="#46d9ff" opacity=".86" filter="url(#softGlow)"/>
      <circle class="floatA" cx="-38" cy="-75" r="9" fill="#ff5d5d" opacity=".74"/>
      <circle class="floatB" cx="-72" cy="29" r="12" fill="#f6c744" opacity=".7"/>
      <text class="value" text-anchor="middle" y="6">61</text>
      <text class="unit" text-anchor="middle" y="31">%</text>
    </g>
  </g>

  <!-- Card 4 -->
  <g transform="translate(1210 160)">
    <rect class="card" width="340" height="390" rx="26"/>
    <text class="name" x="30" y="50">电路星轨</text>
    <text class="desc" x="30" y="80">节点和短线接入，像设备总线</text>
    <g transform="translate(170 205)">
      <circle class="track" r="88" stroke-width="13"/>
      <circle class="ring" r="88" stroke="#54f7c6" stroke-width="13" pathLength="100" stroke-dasharray="77 100"/>
      <circle class="thinTrack" r="62" stroke-dasharray="2 8"/>
      <g stroke="#54f7c6" stroke-width="3" opacity=".72">
        <line x1="0" y1="-88" x2="0" y2="-116"/>
        <line x1="76" y1="-44" x2="103" y2="-59"/>
        <line x1="86" y1="18" x2="116" y2="24"/>
        <line x1="-66" y1="59" x2="-89" y2="80"/>
        <line x1="-88" y1="-3" x2="-118" y2="-4"/>
      </g>
      <g fill="#54f7c6" filter="url(#softGlow)">
        <circle cx="0" cy="-116" r="7"/>
        <circle cx="103" cy="-59" r="6"/>
        <circle cx="116" cy="24" r="8"/>
        <circle cx="-89" cy="80" r="6"/>
        <circle cx="-118" cy="-4" r="7"/>
      </g>
      <text class="value" text-anchor="middle" y="6">77</text>
      <text class="unit" text-anchor="middle" y="31">%</text>
    </g>
  </g>

  <!-- Card 5 -->
  <g transform="translate(70 600)">
    <rect class="card" width="340" height="390" rx="26"/>
    <text class="name" x="30" y="50">声波脉冲</text>
    <text class="desc" x="30" y="80">环外有音频柱，适合动态数据</text>
    <g transform="translate(170 215)">
      <circle class="track" r="77" stroke-width="12"/>
      <circle class="ring" r="77" stroke="url(#cyanViolet)" stroke-width="13" pathLength="100" stroke-dasharray="58 100"/>
      <g stroke="#7c5cff" stroke-width="5" opacity=".82" filter="url(#softGlow)">
        <line class="floatA" x1="0" y1="-102" x2="0" y2="-129"/>
        <line class="floatB" x1="39" y1="-94" x2="51" y2="-122"/>
        <line class="floatA" x1="72" y1="-72" x2="93" y2="-94"/>
        <line class="floatB" x1="97" y1="-35" x2="126" y2="-45"/>
        <line class="floatA" x1="105" y1="5" x2="135" y2="6"/>
        <line class="floatB" x1="-39" y1="-94" x2="-50" y2="-119"/>
        <line class="floatA" x1="-72" y1="-72" x2="-92" y2="-92"/>
        <line class="floatB" x1="-97" y1="-35" x2="-121" y2="-44"/>
        <line class="floatA" x1="-105" y1="5" x2="-130" y2="6"/>
      </g>
      <text class="value" text-anchor="middle" y="6">58</text>
      <text class="unit" text-anchor="middle" y="31">%</text>
    </g>
  </g>

  <!-- Card 6 -->
  <g transform="translate(450 600)">
    <rect class="card" width="340" height="390" rx="26"/>
    <text class="name" x="30" y="50">双轨错位</text>
    <text class="desc" x="30" y="80">内外双轨不同步，层次更强</text>
    <g transform="translate(170 215)">
      <circle class="track" r="96" stroke-width="10"/>
      <circle class="ring dashMove" r="96" stroke="#2de6a8" stroke-width="10" pathLength="100" stroke-dasharray="47 100" stroke-dashoffset="12"/>
      <circle class="thinTrack" r="72" stroke-width="15"/>
      <circle class="ring dashMove" r="72" stroke="#36b7ff" stroke-width="15" pathLength="100" stroke-dasharray="71 100" stroke-dashoffset="-18"/>
      <circle r="48" fill="rgba(54,183,255,0.08)" stroke="rgba(54,183,255,0.22)"/>
      <text class="value" text-anchor="middle" y="6">71</text>
      <text class="unit" text-anchor="middle" y="31">%</text>
    </g>
  </g>

  <!-- Card 7 -->
  <g transform="translate(830 600)">
    <rect class="card" width="340" height="390" rx="26"/>
    <text class="name" x="30" y="50">极光丝带环</text>
    <text class="desc" x="30" y="80">宽窄叠层像丝带，适合背景板</text>
    <g transform="translate(170 215)">
      <circle class="track" r="84" stroke-width="21"/>
      <circle class="ring" r="88" stroke="#24f0ff" stroke-width="8" pathLength="100" stroke-dasharray="81 100" opacity=".94"/>
      <circle class="ring dashMove" r="78" stroke="url(#cyanViolet)" stroke-width="29" pathLength="100" stroke-dasharray="29 5 18 7 18 100" opacity=".78" filter="url(#hardGlow)"/>
      <path d="M -66 -39 C -18 -112 81 -94 93 2" fill="none" stroke="#ff4fd8" stroke-width="9" stroke-linecap="round" opacity=".7" filter="url(#softGlow)"/>
      <text class="value" text-anchor="middle" y="6">81</text>
      <text class="unit" text-anchor="middle" y="31">%</text>
    </g>
  </g>

  <!-- Card 8 -->
  <g transform="translate(1210 600)">
    <rect class="card" width="340" height="390" rx="26"/>
    <text class="name" x="30" y="50">断点扫描</text>
    <text class="desc" x="30" y="80">进度头带拖尾，像扫描雷达</text>
    <g transform="translate(170 215)">
      <circle class="track" r="88" stroke-width="15" stroke-dasharray="1 6" pathLength="100"/>
      <circle class="ring dashMove" r="88" stroke="#f8c24e" stroke-width="15" pathLength="100" stroke-dasharray="12 3 8 3 36 100" stroke-dashoffset="4"/>
      <circle class="ring" r="63" stroke="#ff5d5d" stroke-width="7" pathLength="100" stroke-dasharray="64 100" opacity=".78"/>
      <circle class="pulse" cx="25" cy="-84" r="13" fill="#f8c24e" filter="url(#hardGlow)"/>
      <circle cx="-10" cy="-88" r="5" fill="#f8c24e" opacity=".72"/>
      <circle cx="-40" cy="-78" r="4" fill="#f8c24e" opacity=".42"/>
      <text class="value" text-anchor="middle" y="6">64</text>
      <text class="unit" text-anchor="middle" y="31">%</text>
    </g>
  </g>
</svg>
